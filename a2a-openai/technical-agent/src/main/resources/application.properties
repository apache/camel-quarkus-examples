quarkus.banner.enabled=false
# The port used in dev mode. The orchestrator expects the billing agent on 8081 and the technical agent on 8082.
# Packaged applications use the Quarkus default (8080) unless quarkus.http.port is set.
%dev.quarkus.http.port=8082
# The URL under which this agent is reachable by other agents, advertised in the agent card. Use the public https
# address when deployed.
a2a.technical-agent.public-url=${A2A_TECHNICAL_AGENT_PUBLIC_URL:http://localhost:8082/agents/technical}

# OpenAI (or any OpenAI compatible API such as Azure OpenAI, vLLM, LM Studio, Ollama ...)
#
# The API key is deliberately NOT configured here. The openai component reads it from the
# OPENAI_API_KEY environment variable, so the secret never ends up in a packaged artifact.
camel.component.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
camel.component.openai.model=${OPENAI_MODEL:gpt-5-mini}

# Shared secret that callers must present in the X-API-Key header to use this agent. There is intentionally
# no default value for the prod profile: set the A2A_AGENTS_API_KEY environment variable, otherwise the
# application refuses to start. The dev profile uses a throwaway value so that `mvn quarkus:dev` works out
# of the box.
%dev.a2a.agents.api-key=dev-only-not-a-secret
# Upper bound on the number of tickets this agent works on at the same time. Additional requests are
# rejected with a JSON-RPC error (HTTP 200, code -32000, reason SERVER_BUSY) instead of piling up LLM calls.
a2a.agents.max-concurrent-tasks=4

# The agent card and the prompt are loaded from the classpath, so they must be embedded into the native executable
quarkus.native.resources.includes=cards/*.json,prompts/*.txt
