quarkus.banner.enabled=false

# Support tickets are small. Rejecting large request bodies at the HTTP layer protects both the
# application and your LLM budget from oversized or abusive submissions.
quarkus.http.limits.max-body-size=64K

# OpenAI (or any OpenAI compatible API such as Azure OpenAI, vLLM, LM Studio, Ollama ...)
#
# The API key is deliberately NOT configured here. The openai component reads it from the
# OPENAI_API_KEY environment variable, so the secret never ends up in a packaged artifact.
camel.component.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
camel.component.openai.model=${OPENAI_MODEL:gpt-5-mini}

# A2A specialist agents
#
# Shared secret that the orchestrator presents in the X-API-Key header when calling the specialist agents.
# There is intentionally no default value for the prod profile: set the A2A_AGENTS_API_KEY environment
# variable, otherwise the application refuses to start. The dev profile uses a throwaway value so that
# `mvn quarkus:dev` works out of the box.
%dev.a2a.agents.api-key=dev-only-not-a-secret
# Where the specialist agents are reached. The defaults match the ports the agents use in dev mode. Always
# use https URLs when the agents are reached over a network.
a2a.agents.billing.url=http://localhost:8081/agents/billing
a2a.agents.technical.url=http://localhost:8082/agents/technical

# Upper bound on the number of tickets processed at the same time, and so on the number of concurrent LLM calls.
# Additional requests are rejected with HTTP 503 instead of piling up.
triage.max-concurrent-tickets=4

# The prompt is loaded from the classpath, so it must be embedded into the native executable
quarkus.native.resources.includes=prompts/*.txt
