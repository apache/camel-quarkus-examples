#
# Quarkus
#
quarkus.banner.enabled = false
quarkus.log.file.enabled = true

# HTTPS only, on a random port (prevents port conflicts in tests)
quarkus.http.ssl-port = 0
quarkus.http.insecure-requests = disabled

# Require client certificates (mutual TLS)
quarkus.http.ssl.client-auth = required

#
# TLS registry (default bucket, used by the HTTP server)
# Server key store, and trust store with the client certificate.
# Generated by smallrye-certificate-generator-maven-plugin during the Maven build, see pom.xml
#
quarkus.tls.key-store.p12.path = target/certs/pqc-keystore.p12
# Demo only: generated keys and "changeit" passwords, do not reuse
quarkus.tls.key-store.p12.password = changeit
quarkus.tls.trust-store.p12.path = target/certs/pqc-server-truststore.p12
quarkus.tls.trust-store.p12.password = changeit
# The tests generate their own certificates (@Certificates in AbstractPqcTest)
%test.quarkus.tls.key-store.p12.path = target/test-certs/pqc-keystore.p12
%test.quarkus.tls.trust-store.p12.path = target/test-certs/pqc-server-truststore.p12
# The packaged application (PqcWithFallbackIT) uses the test certificates as well
quarkus.test.integration-test-profile = test

# TLS 1.3 is required for hybrid key exchange
quarkus.tls.protocols = TLSv1.3

# Use the JDK's own TLS stack (SunJSSE), no Bouncy Castle or OpenSSL
quarkus.tls.ssl-engine = jdkssl

# Hybrid post-quantum key exchange (X25519 + ML-KEM-768), with classical fallback.
# Named groups are the JDK defaults (JDK 25.0.5+ includes X25519MLKEM768).
# 'client-negotiated' accepts X25519MLKEM768 but still accepts classical-only clients.
# 'strict' accepts only post-quantum groups (see PqcOnlyProfile in the tests).
# Both fail at startup if the JDK does not support X25519MLKEM768.
# 'relaxed' (Quarkus default) enforces nothing and does no
# startup check, so PQC silently depends on the JDK. Do not use it here.
quarkus.tls.pqc-enforcement-policy = client-negotiated
