#
# Quarkus
#
quarkus.banner.enabled = false
quarkus.log.file.enabled = true

# HTTPS only. Port 0 picks a random free port for dev mode and packaged runs, tests use quarkus.http.test-ssl-port (8444)
quarkus.http.ssl-port = 0
quarkus.http.insecure-requests = disabled

# Require client certificates (mutual TLS)
quarkus.http.ssl.client-auth = required

#
# Quarkus TLS registry - default TLS configuration, picked up by the HTTP server
#
# Certificates are generated by the smallrye-certificate-generator-maven-plugin (see pom.xml) and read from the working
# directory at startup. The password is hardcoded for demonstration only, real deployments should use the Quarkus
# credentials provider or a secrets store instead.
quarkus.tls.key-store.p12.path = target/certs/pqc-keystore.p12
quarkus.tls.key-store.p12.password = changeit
quarkus.tls.trust-store.p12.path = target/certs/pqc-server-truststore.p12
quarkus.tls.trust-store.p12.password = changeit

# Hybrid post-quantum groups exist in TLS 1.3 only. TLSv1.3 is the TLS registry default, it is set explicitly so that
# TLS 1.2, whose key exchange is always classical, is not enabled by accident.
quarkus.tls.protocols = TLSv1.3

# Post-quantum key exchange. The enforcement policy decides which key exchange groups are offered, the optional
# quarkus.tls.key-exchange-groups overrides the defaults of the policy:
# client-negotiated: default X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024, X25519, secp256r1, x448, secp384r1,
#   secp521r1. PQC capable clients negotiate a hybrid group, other clients fall back to a classical one.
# strict: default X25519MLKEM768, SecP256r1MLKEM768, SecP384r1MLKEM1024. Clients without a post-quantum group are
#   rejected. A custom list must contain post-quantum groups only, otherwise the defaults are used (see README.adoc).
# Both policies need a JDK whose TLS implementation supports the hybrid groups (Java 25 with the October 2026 update
# or Java 27), see README.adoc.
quarkus.tls.pqc-enforcement-policy = client-negotiated

# pqc-only profile: post-quantum clients only. Activate with -Dquarkus.profile=pqc-only, PqcOnlyTest runs with it.
%pqc-only.quarkus.tls.pqc-enforcement-policy = strict

#
# Quarkus - Camel
#
quarkus.camel.health.enabled = true
