#
# Quarkus
#
quarkus.banner.enabled = false
quarkus.management.enabled = true
quarkus.management.port=9876

# Identifier for the origin of spans created by the application
quarkus.application.name = camel-quarkus-observability

# Enables optional tracing of each Camel processor
# quarkus.camel.opentelemetry2.trace-processors=true

# For OTLP.
# Note that the OTLP exporter endpoint and protocol are deliberately not configured here. In dev mode, the Grafana
# LGTM dev service sets quarkus.otel.exporter.otlp.endpoint & quarkus.otel.exporter.otlp.protocol automatically, so
# that traces are exported to the container it manages. When running the packaged application, the Quarkus defaults
# apply (gRPC on http://localhost:4317) and can be overridden for your own collector, for example with:
#
#   export QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT=http://my-collector:4317
#
quarkus.otel.exporter.otlp.timeout = 30s
# To enable tracing (it is disabled by default via camel-quarkus-observability-services)
quarkus.otel.sdk.disabled=false
# Export log records so that they can be correlated with traces
quarkus.otel.logs.enabled=true

#
# Grafana LGTM dev service
#
# Bind the Grafana UI to a fixed port, instead of the random one it would get by default
%dev.quarkus.observability.lgtm.grafana-port = 3000

# The Prometheus instance of the dev service scrapes the application from within its container, using a Host header of
# host.docker.internal. Dev mode binds the HTTP server to localhost, which makes Quarkus reject any request whose Host
# header is not a localhost name with a 400 response, so the scrape target has to be allowed explicitly.
%dev.quarkus.http.host-validation.allowed-hosts = localhost,host.docker.internal

# On macOS and Windows the above is enough, as host.docker.internal is proxied through to the host loopback. On Linux
# it resolves to the container gateway address instead, which cannot reach a server bound to localhost, so there the
# HTTP server has to listen on a non loopback address as well. Uncomment the following line when developing on Linux.
# %dev.quarkus.http.host = 0.0.0.0

#
# Camel
#
camel.context.name = camel-quarkus-observability
greeting-app.service.host = ${CAMEL_QUARKUS_OBSERVABILITY_SERVICE_HOST:localhost}
greeting-app.service.port = ${CAMEL_QUARKUS_OBSERVABILITY_SERVICE_PORT_HTTP:${quarkus.http.port}}
%test.greeting-app.service.port = ${quarkus.http.test-port}
greeting-provider-app.service.host = localhost
greeting-provider-app.service.port = ${quarkus.http.port}
%test.greeting-provider-app.service.port = ${quarkus.http.test-port}

# Enable the supervising route controller. Routes that fail to start do not prevent the application from starting.
# Instead, the controller keeps trying to start them in the background, using a backoff between each attempt
camel.routecontroller.enabled = true
# Attempt to start a failing route up to 10 times, with a 2 second delay between attempts, before giving up on it
camel.routecontroller.back-off-max-attempts = 10
camel.routecontroller.back-off-delay = 2000
# Whether the camel-routes health check reports a route as DOWN while it is being restarted (default true)
# camel.routecontroller.unhealthy-on-restarting = true
# Whether the camel-routes health check reports a route as DOWN once all restart attempts are used up (default true).
# When false, the route is reported as UNKNOWN instead
# camel.routecontroller.unhealthy-on-exhausted = true

#
# Camel health checks
#
# The camel-routes, camel-consumers and registry checks are enabled by default. Producer checks are not
# camel.health.routes-enabled = true
# camel.health.consumers-enabled = true
# camel.health.registry-enabled = true
# camel.health.producers-enabled = false
# Exclude specific checks by ID or route ID. Multiple patterns can be separated by commas and wildcards are supported
# camel.health.exclude-pattern = timer*
# The amount of detail in health check responses: default, full or oneline
# camel.health.exposure-level = full

# Optional hawtio-online support
quarkus.camel.jolokia.kubernetes.client-principal=cn=hawtio-online.hawtio.svc
# Uncomment when deploying to Kubernetes or OpenShift. The Jolokia agent binds to localhost by default,
# which is unreachable from outside the pod, and the default restrictor rejects non-loopback requests.
# quarkus.camel.jolokia.server.host=0.0.0.0
# quarkus.camel.jolokia.remote-access-allowed=true
