# The knowledge base. Every file in the folder is ingested at startup, and a file added or
# edited while the application runs is picked up on the next poll. No route, no ingestion
# code: the langchain4j-ingest extension reads, splits, embeds and stores. The pipeline
# writes to the application's only embedding store, the pgvector store below.
documents.directory=documents
quarkus.camel.langchain4j.ingest.docs.source.directory=${documents.directory}
quarkus.camel.langchain4j.ingest.docs.max-segment-size=500
quarkus.camel.langchain4j.ingest.docs.max-overlap-size=50

# The vector store: pgvector through Quarkus LangChain4j. Dev Services start a pgvector
# enabled PostgreSQL in dev and test mode; in prod mode point the datasource at your own.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.image-name=docker.io/pgvector/pgvector:pg17
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/documents
%prod.quarkus.datasource.username=postgres
%prod.quarkus.datasource.password=postgres
# all-MiniLM-L6-v2 produces 384-dimensional vectors
quarkus.langchain4j.pgvector.dimension=384
# the vector extension is created on start (the default only does so in dev and test mode)
quarkus.langchain4j.pgvector.register-vector-pg-extension=true
# the folder is indexed again on every start, so start from an empty table
quarkus.langchain4j.pgvector.drop-table-first=true

# The chat model behind the assistant: a model served by Ollama, https://ollama.com. Pull the
# model once with `ollama pull llama3.2`; point OLLAMA_BASE_URL at an Ollama running elsewhere.
quarkus.langchain4j.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
quarkus.langchain4j.ollama.chat-model.model-id=${OLLAMA_MODEL:llama3.2}
quarkus.langchain4j.ollama.chat-model.temperature=0.1
quarkus.langchain4j.ollama.timeout=120s
# Ollama is run by you rather than by Dev Services: pulling a model is a multi-gigabyte download
quarkus.langchain4j.ollama.devservices.enabled=false
# Embeddings come from the in-process all-MiniLM-L6-v2 model, which Quarkus LangChain4j registers
# as the EmbeddingModel bean from the langchain4j-embeddings-all-minilm-l6-v2 dependency. The
# Ollama embedding model is switched off, so ingestion and retrieval share that one bean.
quarkus.langchain4j.ollama.embedding-model.enabled=false
